# Hand-authored champion archetypes for the playstyle recommendation engine
# (src/lolcoach/playstyle/). Axis/salience values reflect League of Legends
# kit/role identity from domain knowledge -- Riot's API exposes no win-rate
# or tier data, and scraping third-party sites for it is against their ToS,
# so this is the legitimate, documented alternative (see
# src/lolcoach/playstyle/archetypes.py's module docstring).
#
# axes: the champion's own typical playstyle profile, 0..1 per axis, same 6
#   axes as PlaystyleVector (aggression, farming, vision, objective_focus,
#   risk_tolerance, teamfight_vs_split -- 0 = pure splitpush, 1 = pure
#   teamfight).
# salience: how much each axis defines this champion's identity -- used to
#   weight fit scoring so a champion's signature traits count more than
#   incidental ones. Not required to sum to 1, kept on a comparable ~0..1
#   scale.

