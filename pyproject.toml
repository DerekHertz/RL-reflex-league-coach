[project]
name = "lolcoach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reflex", email = "reflex@runloop.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
lolcoach = "lolcoach:main"

[[tool.uv.index]]
url = "http://mirror.runloop.ai:8080/pip/simple/"
default = true

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = ["llm: live LLM tests, run manually with -m llm"]
